<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khedma</title>

    <link rel="script" href="forssa.js">
    <link rel="stylesheet" href="forssa.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            <div class="logo-icon">
                ◆
            </div>
            <span>FORSSA</span>
        </div>

        <nav>
            <a href="#" class="active">Accueil</a>
            <a href="#">Rechercher</a>
            <a href="#">Progrès</a>
            <a href="#">Dashboard</a>
        </nav>

        <div class="auth">
            <a href="#" class="connexion">Connexion</a>
            <button id="inscription">S'inscrire</button>
        </div>

    </header>


    <!-- HERO -->
    <section class="hero">

        <div class="circle circle1"></div>
        <div class="circle circle2"></div>

        <div class="hero-content">

            <div class="badge">
                <span></span>
                +15 000 professionnels vérifiés au Maroc
            </div>

            <h1>
                Trouvez le bon<br>
                <span>professionnel</span><br>
                pour votre projet
            </h1>

            <p>
                Artisans qualifiés, employés et prestataires de confiance —
                vérifiés, évalués, et suivis à chaque étape de votre projet.
            </p>

            <div class="buttons">

                <button class="btn-primary" id="proBtn">
                    Je cherche un professionnel
                </button>

                <button class="btn-secondary" id="emploiBtn">
                    Je cherche un emploi
                </button>

            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
